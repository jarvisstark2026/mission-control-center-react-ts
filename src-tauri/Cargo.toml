[package]
name = "mission-control-center"
version = "0.1.0"
description = "Mission Control desktop shell"
authors = ["Mission Control"]
edition = "2021"

[lib]
name = "mission_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mission-control-center"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
time = { version = "0.3", features = ["formatting"] }
